# /etc/nginx/sites-available/mncardio.itsystem.mn
#
# Test/staging environment for MnCardio: the web app and the mobile app both
# talk to this host.
#
# Install:
#   cp deploy/nginx/mncardio-upgrade-map.conf /etc/nginx/conf.d/
#   cp deploy/nginx/mncardio.itsystem.mn.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/mncardio.itsystem.mn /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d mncardio.itsystem.mn
#
# This file is HTTP-only on purpose. certbot --nginx rewrites it in place: it
# adds the :443 server block, the certificate lines, and the :80 -> :443
# redirect. Writing the TLS block by hand before the certificate exists just
# stops nginx from starting.
#
# This box already serves other sites. This is a NEW file; do not merge these
# directives into somebody else's server block.

server {
    listen 80;
    listen [::]:80;
    server_name mncardio.itsystem.mn;

    # Chat accepts attachments up to 50 MB (BaseController.js:250-267).
    # nginx's 1 MB default would reject them before the app ever saw them, and
    # the error would look like an app bug rather than a proxy limit.
    client_max_body_size 50m;

    access_log /var/log/nginx/mncardio.access.log;
    error_log  /var/log/nginx/mncardio.error.log;

    # ---- the React build, served straight from disk -----------------------
    # Deliberately not `vite preview` under PM2, which is what
    # frontend/ecosystem.config.js does. That is a dev convenience: it is
    # slower, and it adds a process to supervise for no benefit.
    root /var/www/mncardio;
    index index.html;

    location / {
        # SPA fallback, or a refresh on /admin/Visit returns 404.
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients pin themselves to an old
    # bundle after a deploy and load asset URLs that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ---- the API ----------------------------------------------------------
    # The frontend hardcodes baseURL="/api" (src/config/Server.js) and there is
    # no way to point it elsewhere, so this prefix is load-bearing.
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Report generation goes through Puppeteer and can genuinely take
        # minutes on a large register; the app's own SQL request timeout is
        # 300s (config/DbConnection.js). A 60s default here would cut those off
        # with a 504 that looks like a backend crash.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5001/health;
        access_log off;
    }

    # ---- Socket.IO --------------------------------------------------------
    # Two separate mount paths, NOT under /api (WebSockets/ChatSocket.js:40,
    # NotificationSocket.js:33). Without these two blocks the SPA fallback
    # above swallows them and returns index.html, so chat and notifications
    # fail while every other feature works — a confusing failure to diagnose.
    location /chatmessage {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /notification {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
