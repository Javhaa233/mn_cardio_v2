# /etc/nginx/conf.d/mncardio-upgrade-map.conf
#
# The WebSocket upgrade map must live in the http{} context, so it cannot go
# inside the site file. Defining $connection_upgrade here keeps the site file
# copy-pasteable and avoids the "upgrade" header being forwarded on ordinary
# requests, which some proxies choke on.
#
# If another site on this box already defines $connection_upgrade, nginx will
# refuse to start with "duplicate map". Check first:
#   grep -rn 'connection_upgrade' /etc/nginx/
# and if it already exists, delete this file and reuse theirs.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
