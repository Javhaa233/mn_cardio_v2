name: mncardio
description: МнКардио — Зүрх судасны үндэсний төвийн гар утасны хувилбар (үйлчлүүлэгчийн модуль).
publish_to: "none"
version: 0.2.1+3

# Доод хязгаарыг Flutter 3.27 гэж тавьсан нь санаатай: код нь `Color.withValues`,
# `CardThemeData`, `DialogThemeData` зэрэг тэр хувилбараас нэвтэрсэн API
# ашигладаг. Үүнээс доош билд хийхгүй.
environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- Сүлжээ / API ---
  # dio: interceptor заавал хэрэгтэй тул http биш dio. FLUTTER.md § "Packages".
  dio: 5.7.0
  socket_io_client: 2.0.3+1

  # --- Хадгалалт ---
  # JWT-г зөвхөн Keystore/Keychain дотор. shared_preferences нь задгай текст.
  flutter_secure_storage: 9.2.2
  shared_preferences: 2.3.2

  # --- Нэвтрэлт ---
  local_auth: 2.3.0
  local_auth_android: ^1.0.56
  local_auth_darwin: ^1.4.1

  # --- Төлөв удирдлага ---
  # Чиглүүлэлтэд Navigator-ыг шууд ашиглана: гүн холбоос (deep link) шаардлага
  # тендерт байхгүй тул go_router нэмэх шалтгаангүй.
  provider: 6.1.2

  # --- Монгол хэл, огноо, тоон формат ---
  intl: 0.20.2

  # --- Хавсралт (зураг, баримт бичиг, аудио файл) ---
  file_picker: 10.3.10
  image_picker: 1.1.2
  open_filex: 4.7.0

  # --- График ---
  fl_chart: 0.69.0

  # --- Сануулга (push байхгүй тул төхөөрөмж дээрх мэдэгдэл) ---
  flutter_local_notifications: 17.2.3
  timezone: 0.9.4
  flutter_timezone: 5.1.0

  # --- Бусад ---
  package_info_plus: 8.0.2
  path_provider: 2.1.4
  path: 1.9.1
  uuid: 4.5.1
  cupertino_icons: 1.0.8

  # --- Чатын дуу, видео (§2.1 "дуу бичлэг") ---
  record: 7.1.1
  permission_handler: 13.0.2
  just_audio: 0.10.6
  audio_session: 0.2.4
  video_player: 2.14.0

  # --- Тайлан татах (§1.8 XLS, TXT) — файлыг утсан дээр үүсгээд хуваалцана ---
  excel: 4.0.6
  share_plus: 12.0.2

  # --- Сэргээн засах дасгалын тоглуулагч — дасгалын турш дэлгэц унтрахгүй ---
  wakelock_plus: 1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    # Системийн албан ёсны лого — `frontend/public/logo.ico`-ийн 256px хувилбар.
    # Flutter .ico уншдаггүй тул PNG болгож хөрвүүлсэн (тунгалаг дэвсгэртэй).
    - assets/logo.png
    # Дасгалын тоглуулагчийн 3-2-1 дохио (давтамжаар үүсгэсэн, лицензгүй).
    - assets/sounds/
