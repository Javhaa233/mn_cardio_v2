<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Зүрхний дутагдал - Амбулаторийн үзлэг</title>
    <!-- <link rel="icon" href="./favicon.ico" type="image/x-icon" /> -->
    <style>
      html {
        zoom: 2.5;
      }
      body {
        margin: 0 auto;
        font-family: Helvetica, "Arial", sans-serif;
        font-size: 7px;
      }

      * {
        box-sizing: border-box;
      }

      .main {
        width: 565px;
        overflow: hidden;
        padding: 0 15px 0 15px;
      }

      .header {
        text-align: center;
        font-size: 9px;
        padding: 2px;
        font-weight: 500;
        margin: 0 25% 10px 25%;
      }

      table {
        width: 100%;
        border: none;
        border-collapse: collapse;
        font-size: 6px;
      }

      /* table tr {
      } */

      table th {
        background-color: #000;
        text-align: left;
        padding: 0 4px;
      }

      table td {
        border: none;
        padding: 1px 4px;
        vertical-align: top;
      }

      .tableHeader {
        color: #fff;
        font-weight: 500;
        margin: 2px 0;
      }

      table tr.subheader {
        background-color: #999999;
      }

      /* Check Div */
      .checkDiv {
        float: left;
        position: relative;
        border: 1px solid #ccc;
        width: 6px;
        height: 6px;
        margin: 0 2px 1px 0;
      }

      .checkSpan {
        position: absolute;
        top: -4px;
        font-size: 8px;
        font-weight: 500;
        /* visibility: "visible"; */
      }

      /* Container */
      .container {
        margin: 0 auto;
        padding: 5px;
        width: 512px;
        border: 1px solid #000;
      }

      .main-title {
        text-align: center;
        font-size: 8px;
        font-weight: 500;
        border: 0.5px solid #000;
        background-color: #9cc1e5;
        padding: 2px;
      }

      .sub-title {
        font-size: 6px;
        font-weight: 600;
        color: #fff;
        border: 0.5px solid #000;
        background-color: #1e4e79;
        padding: 1px 2px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 class="main-title">АМБУЛАТОРИЙН ҮЗЛЭГ</h2>
      <h6 class="sub-title">Эмчлүүлэгчийн ерөнхий мэдээлэл</h6>

      <table class="table">
        <thead>
          <tr>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td></td>
          </tr>
        </tbody>
      </table>

      <h6 class="sub-title">Эмчлүүлэгчийн ерөнхий мэдээлэл</h6>
    </div>
  </body>
</html>
